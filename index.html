<style>
/* ============ TOKENS ============ */
:root{
  --paper:#f2f5fa; --surface:#ffffff; --surface-2:#e9eef7; --ink:#0b1730; --ink-2:#34445f; --muted:#5a6a84;
  --line:#d8e0ed; --faint:color-mix(in srgb,var(--ink) 16%,transparent);
  --serif:'Newsreader','Merriweather',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(11,23,48,.05),0 14px 30px -18px rgba(11,23,48,.28);
  --a:#1d4ed8; --a-ink:#1d4ed8; --sec-y:80px; --sub-gap:28px; --pub-op:60%;
}
.dark{
  --paper:#08111f; --surface:#0f1b30; --surface-2:#14243f; --ink:#e8eff9; --ink-2:#c2cee2; --muted:#93a4bf;
  --line:#21324f; --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 34px -18px rgba(0,0,0,.7);
}
[data-acc=blue]{--a:#1d4ed8;--a-ink:#1d4ed8}   .dark [data-acc=blue]{--a:#4d7cff;--a-ink:#9db8ff}
[data-acc=teal]{--a:#0d9488;--a-ink:#0f766e}   .dark [data-acc=teal]{--a:#14b8a6;--a-ink:#5eead4}
[data-acc=violet]{--a:#7c3aed;--a-ink:#6d28d9} .dark [data-acc=violet]{--a:#8b5cf6;--a-ink:#c4b5fd}
[data-acc=indigo]{--a:#4f46e5;--a-ink:#4338ca} .dark [data-acc=indigo]{--a:#6366f1;--a-ink:#b4bcff}
[data-acc=gold]{--a:#b7791f;--a-ink:#8a5a12}   .dark [data-acc=gold]{--a:#d69e2e;--a-ink:#f6c760}
[data-acc=cyan]{--a:#0e7490;--a-ink:#0e7490}   .dark [data-acc=cyan]{--a:#06b6d4;--a-ink:#67e8f9}
[data-acc=emerald]{--a:#059669;--a-ink:#047857}.dark [data-acc=emerald]{--a:#10b981;--a-ink:#6ee7b7}
[data-acc=rose]{--a:#e11d48;--a-ink:#be123c}   .dark [data-acc=rose]{--a:#f43f5e;--a-ink:#fda4af}
[data-acc=amber]{--a:#d97706;--a-ink:#b45309}  .dark [data-acc=amber]{--a:#f59e0b;--a-ink:#fcd34d}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:5rem;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit} img{max-width:100%;display:block} h1,h2,h3,h4,p,ul,figure{margin:0} ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a-ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ HEADER ============ */
.site-header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:64px}
.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;min-width:0}
.brand-av{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none;background:var(--surface-2)}
.brand-av img{width:100%;height:100%;object-fit:cover}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-name{font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--serif);font-size:.82rem;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:none;gap:.15rem;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:.45rem .8rem;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--ink-2);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface-2)}
.nav a.active{background:var(--ink);color:var(--paper)}
@media(min-width:1024px){.nav{display:flex}}
.actions{display:flex;align-items:center;gap:.5rem;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:background .2s}
.icon-btn:hover{background:var(--surface-2)}
.dark .i-moon,.i-sun{display:none} .dark .i-sun{display:inline} .dark .i-moon{display:none}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-radius:12px;background:var(--a);color:#fff;font-size:.8rem;font-weight:700;text-decoration:none;border:0;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.1)}
.btn-cv{display:none} @media(min-width:640px){.btn-cv{display:inline-flex}}
.menu-btn{display:grid} @media(min-width:1024px){.menu-btn{display:none}}
.menu-backdrop{position:fixed;inset:0;z-index:55;background:rgba(6,14,28,.5);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.menu-backdrop.open{opacity:1;visibility:visible;transition:opacity .3s}
.mobile-menu{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(84vw,320px);display:flex;flex-direction:column;padding:1rem 1.25rem 1.5rem;background:var(--surface);border-left:1px solid var(--line);box-shadow:-24px 0 48px -24px rgba(0,0,0,.45);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
.mobile-menu.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.drawer-close{align-self:flex-end;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;margin-bottom:.75rem}
.mobile-menu a{display:block;padding:.65rem .25rem;font-weight:600;text-decoration:none;color:var(--ink-2);border-bottom:1px solid var(--line)}
.mobile-menu .btn{margin-top:.9rem;justify-content:center;width:100%;border-bottom:0;color:#fff}
@media(min-width:1024px){.mobile-menu,.menu-backdrop{display:none!important}}
@media(prefers-reduced-motion:reduce){.mobile-menu,.menu-backdrop{transition:none}}

/* ============ LINKS (hyperlink / external button) ============ */
.linked{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.2rem .55rem;max-width:100%}
.xlink{text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 55%,transparent);transition:color .2s,text-decoration-color .2s}
.xlink:hover{color:var(--a-ink);text-decoration-style:solid;text-decoration-color:currentColor}
.xlink .xi{font-size:.62em;margin-left:.3em;opacity:.75}
.xbtn{display:inline-flex;align-items:center;gap:.35rem;padding:.12rem .6rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--a-ink) 45%,transparent);color:var(--a-ink);font-size:.7rem;font-weight:700;line-height:1.5;text-decoration:none;white-space:nowrap;transition:background .2s}
.xbtn:hover{background:color-mix(in srgb,var(--a) 14%,transparent)}
.xbtn i{font-size:.62rem}

/* ============ HERO ============ */
.hero{--ink:#eaf1fb;--ink-2:#cbd7ea;--muted:#a2b3cd;--line:rgba(255,255,255,.16);--a:#5b8cff;--a-ink:#a8c1ff;
  position:relative;overflow:hidden;color:var(--ink);isolation:isolate;
  background:radial-gradient(900px 480px at 88% -8%,rgba(45,110,255,.42),transparent 62%),radial-gradient(700px 420px at -4% 108%,rgba(20,184,166,.28),transparent 60%),linear-gradient(180deg,#081a31,#0a2240);
  padding:var(--pt,clamp(3rem,7vw,5.5rem)) 0 var(--pb,clamp(3rem,6vw,4.5rem))}
.hero.lift{padding-bottom:calc(var(--pb,clamp(3rem,6vw,4.5rem)) + 3rem)}
.hero.has-mh{display:flex;align-items:center}.hero.has-mh>.wrap{width:100%}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(5,12,28,var(--ov,0));pointer-events:none}
.hero-tree{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(to left,#000 10%,rgba(0,0,0,.15) 80%);mask-image:linear-gradient(to left,#000 10%,rgba(0,0,0,.15) 80%)}
.hero-tree path{fill:none;stroke:#7fa8ff;stroke-width:1.2;stroke-opacity:.42;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--d,0s)}
.hero-tree circle{fill:#5eead4;opacity:0;animation:pop .6s ease forwards;animation-delay:var(--d,2s)}
.hero-tree .tip{fill:#9bc0ff}
.hero-tree .pulse{transform-box:fill-box;transform-origin:center;animation:pop .6s ease forwards,beat 3.6s ease-in-out infinite;animation-delay:var(--d,2s),calc(var(--d,2s) + .6s)}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes pop{to{opacity:.95}} @keyframes beat{50%{transform:scale(1.9);opacity:.5}}
.hero-grid{display:grid;gap:clamp(1.5rem,4vw,3.25rem);align-items:center}
.hero-grid.has-av{grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.hero-grid.has-av.pos-left{grid-template-columns:auto minmax(0,1fr)}.hero-grid.has-av.pos-right{grid-template-columns:minmax(0,1fr) auto}.hero-grid.has-av.pos-right .hero-av{order:2}}
.hero-grid.al-center .hero-av{justify-self:center}.hero-grid.al-right .hero-av{justify-self:end}
.hero-grid.al-center .hero-main{text-align:center;align-items:center}.hero-grid.al-right .hero-main{text-align:right;align-items:flex-end}
.al-center .chips,.al-center .socials,.al-center .hero-addr{justify-content:center}.al-right .chips,.al-right .socials,.al-right .hero-addr{justify-content:flex-end}
.hero-av{width:clamp(150px,19vw,214px);aspect-ratio:1;padding:4px;border-radius:30px;background:linear-gradient(140deg,#6b97ff,#2dd4bf);box-shadow:0 34px 60px -24px rgba(0,0,0,.7)}
.hero-av.slide{animation:slideIn .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
.hero-av img{width:100%;height:100%;object-fit:cover;border-radius:26px;background:#0a2240}
.hero-av.circle,.hero-av.circle img{border-radius:50%}
.hero-main{display:flex;flex-direction:column;gap:1.05rem;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .8rem;border-radius:999px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.09);border:1px solid var(--line);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:#5eead4;box-shadow:0 0 0 0 rgba(94,234,212,.6);animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(94,234,212,0)}100%{box-shadow:0 0 0 0 rgba(94,234,212,0)}}
.hero h1{font-family:var(--serif);font-weight:600;font-size:var(--h1-size,clamp(2.5rem,6vw,4.6rem));color:var(--h1-color,inherit);line-height:1.04;letter-spacing:-.025em}
.hero-pos{font-family:var(--serif);font-size:var(--pos-size,clamp(1.1rem,2vw,1.4rem));line-height:1.35;color:var(--pos-color,#bcd0ff);font-weight:500}
.hero-addr{display:flex;align-items:flex-start;gap:.5rem;font-size:.88rem;color:var(--muted);white-space:pre-line}.hero-addr i{margin-top:.3rem;color:var(--a-ink)}
.hero-inst{font-size:.92rem;color:var(--ink-2);font-weight:500}
.hero-bio{max-width:none;width:100%;color:var(--bio-color,var(--ink-2));font-size:var(--bio-size,1rem);line-height:1.75;text-align:justify;text-justify:inter-word;hyphens:auto;white-space:pre-line}
.al-center .hero-bio{text-align:center}.al-right .hero-bio{text-align:right}
@media(max-width:640px){.hero-bio{text-align:left}.al-center .hero-bio{text-align:center}.al-right .hero-bio{text-align:right}}
.hero-kw{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.1rem;padding-top:.85rem;border-top:1px solid var(--line)}
.hero-kw .tag{padding:.12rem .6rem;font-size:.72rem;border-radius:8px}
.al-center~.hero-kw{justify-content:center}.al-right~.hero-kw{justify-content:flex-end}
.tags{display:flex;flex-wrap:wrap;gap:.5rem}
.tag{display:inline-flex;align-items:center;gap:.5rem;padding:.32rem .75rem;border-radius:10px;font-size:.78rem;font-weight:500;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.tag i{color:var(--a-ink)}
.socials{display:flex;flex-wrap:wrap;gap:.55rem;padding-top:.35rem}
.soc{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem .85rem;border-radius:12px;font-size:.78rem;font-weight:600;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);transition:background .2s,transform .2s}
.soc:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}

/* ============ METRICS ============ */
.metrics-sec{padding:2.5rem 0;background:var(--paper);border-bottom:1px solid var(--line)}
.metrics-sec.lift{margin-top:calc(-1 * clamp(2.6rem,5vw,3.6rem));padding:0;background:transparent;border-bottom:0;position:relative;z-index:2}
.metrics-sec.lift+.sec{padding-top:clamp(3.5rem,7vw,5.5rem)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.metric{padding:1.3rem 1rem;text-align:center;border-left:1px solid var(--line)}
.metric:first-child{border-left:0}
.metric b{display:block;font-family:var(--serif);font-size:clamp(2rem,4vw,2.9rem);line-height:1.05;font-weight:600;color:var(--a-ink);letter-spacing:-.02em}
.metric span{display:block;margin-top:.35rem;font-size:.78rem;font-weight:600;color:var(--muted)}
@media(max-width:560px){.metric:nth-child(odd){border-left:0}.metric:nth-child(n+3){border-top:1px solid var(--line)}}

/* ============ SECTIONS ============ */
.sec{--bg:var(--paper);padding:var(--sec-y) 0;background:var(--bg);border-bottom:1px solid var(--line)}
.sec.alt{--bg:var(--surface)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) fit-content(58%) auto;align-items:center;margin-bottom:2.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--line)}
.sec-title{display:flex;align-items:center;gap:1rem;min-width:0}
.sec-num{font-family:var(--serif);font-size:2.2rem;font-weight:500;line-height:1;color:var(--faint);min-width:2.3rem}
.sec-icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;flex:none;font-size:1.25rem;color:var(--a-ink);background:color-mix(in srgb,var(--a) 13%,var(--surface))}
.sec-eyebrow{font-size:.82rem;font-weight:600;color:var(--a-ink);line-height:1.3}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.65rem,3.2vw,2.35rem);line-height:1.15;letter-spacing:-.012em}
.sec-tools{grid-column:2;grid-row:1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5rem;align-items:center;margin-left:1.25rem}
.sec-title{grid-column:1;grid-row:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(1.25rem,3vw,2rem);box-shadow:var(--shadow)}
.alt .card{background:var(--paper);box-shadow:none}
.acc-top{border-top:4px solid var(--a)}
.muted{color:var(--muted)}
.grid{display:grid;gap:var(--sub-gap)}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.chip{display:inline-flex;align-items:center;padding:.18rem .65rem;border-radius:999px;font-size:.72rem;font-weight:700;line-height:1.5;background:color-mix(in srgb,var(--a) 13%,var(--surface));color:var(--a-ink)}
.chip.line{background:transparent;border:1px solid var(--line);color:var(--ink-2)}

/* -- research focus -- */
.rf-h{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;font-size:.95rem;font-weight:700;color:var(--a-ink)}
.rf-p{white-space:pre-line;color:var(--ink-2);line-height:1.8}
.rf-big .rf-p{font-family:var(--serif);font-size:1.12rem;line-height:1.75;color:var(--ink)}
.rf-stack{display:flex;flex-direction:column;gap:var(--sub-gap);min-width:0}
.rf-stack>.card{padding:1.35rem}
.rf-stack .rf-p{font-size:.92rem}
.live{width:9px;height:9px;border-radius:50%;background:var(--a);animation:ping 2.4s infinite;flex:none}
.news-i{display:flex;gap:.75rem;font-size:.84rem;line-height:1.5;color:var(--ink-2)}
.news-d{flex:0 0 5.4rem;font-weight:700;color:var(--a-ink)}
@media(prefers-reduced-motion:reduce){.news-track.scroll{animation:none}.news-view{overflow:auto}.hero-tree path{animation:none;stroke-dashoffset:0}.hero-tree circle{animation:none;opacity:.9}.dot,.live{animation:none}}

/* -- education -- */
.edu{position:relative;display:flex;flex-direction:column;gap:.85rem;border-left:5px solid var(--a)}
.edu-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}
.edu h3,.exp h3,.aw h3,.ref h3{font-family:var(--serif);font-weight:600;font-size:1.4rem;line-height:1.25}
.edu-inst{font-weight:600;color:var(--ink-2)}
.edu-desc{font-size:.9rem;color:var(--muted);line-height:1.75}

/* -- skills -- */
.skill-h{display:flex;align-items:center;gap:.9rem;padding-bottom:1rem;margin-bottom:1.1rem;border-bottom:1px solid var(--line)}
.skill-h .sec-icon{width:44px;height:44px;border-radius:13px;font-size:1.05rem}
.skill-h h3{font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.25}
.skill-h p{font-size:.85rem;color:var(--muted)}
.bul{display:flex;flex-direction:column;gap:.85rem;font-size:.92rem;color:var(--ink-2);line-height:1.65}
.bul li{display:flex;gap:.75rem}
.bul li>i{color:var(--a);margin-top:.42rem;font-size:.7rem;flex:none}
.bul b{color:var(--ink);font-weight:650}

/* -- publications -- */
.pub-search{display:flex;align-items:center;gap:.65rem;width:min(100%,22rem);padding:0 1rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);transition:border-color .2s,box-shadow .2s}
.alt .pub-search{background:var(--paper)}
.pub-search:focus-within{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
.pub-search i{flex:none;color:var(--muted);font-size:.85rem}

  // a metrics strip that directly follows a hero floats up over the hero's lower edge
  parts.forEach((x, i) => { if (x.type === 'metrics' && parts[i - 1] && parts[i - 1].type === 'about') { parts[i - 1].html = parts[i - 1].html.replace('class="hero"', 'class="hero lift"'); x.html = x.html.replace('class="metrics-sec"', 'class="metrics-sec lift"'); } });
  $('#main').innerHTML = parts.map(x => x.html).join('');
  renderChrome(p, nav);
  applyTypography();
  applyStyles(list.filter(x => vis[x.id] !== false)); applyPageBg(); initCountUp();
  if (spy) spy.disconnect();
  if ('IntersectionObserver' in window) {
    spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) $$('#nav a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
    $$('#main > section').forEach(el => spy.observe(el));
  }
}

function renderChrome(p, nav) {
  const name = t(p.name), sub = t(p.headerTitle) || t(siteText('navTitle')), av = t(p.avatarUrl);
  $('#brand-av').hidden = !av; if (av) { $('#brand-av img').src = av; $('#brand-av img').alt = name || 'Profile'; }
  $('#brand-name').textContent = name; $('#brand-name').hidden = !name;
  $('#brand-sub').textContent = sub; $('#brand-sub').hidden = !sub;
  $('#brand').hidden = !(av || name || sub);
  $('#nav').innerHTML = nav.map(n => `<a href="${esc(n.href)}">${esc(n.label)}</a>`).join(''); $('#nav').hidden = !nav.length;
  const cv = heroCfg(p).showCv === false ? '' : safeUrl(p.cvUrl), cvTxt = siteText('cv'), cvMob = siteText('downloadCv') || cvTxt;
  const cvAttr = cv ? (isExternal(cv) ? ' target="_blank" rel="noopener noreferrer"' : ' download') : '';
  const cvBtn = $('#cv-btn'); cvBtn.hidden = !cv || !has(cvTxt); if (cv) { cvBtn.href = cv; cvBtn.toggleAttribute('download', !isExternal(cv)); if (isExternal(cv)) { cvBtn.target = '_blank'; cvBtn.rel = 'noopener noreferrer'; } $('#cv-btn span').textContent = cvTxt; }
  $('#mobile-menu').innerHTML = '<button class="drawer-close" data-act="menuclose" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>' + nav.map(n => `<a href="${esc(n.href)}">${esc(n.label)}</a>`).join('') + (cv && has(cvMob) ? `<a class="btn" href="${esc(cv)}"${cvAttr}><i class="fa-solid fa-file-pdf"></i><span>${esc(cvMob)}</span></a>` : '');
  $('#menu-btn').hidden = !nav.length && !cv; setMenu(false);
  document.title = t(siteText('title')) || name || 'Portfolio';
  const desc = t(p.bio).slice(0, 160); const md = $('meta[name=description]'); if (md) md.content = desc;
  const fname = [name, t(p.title)].filter(Boolean).join(', '), fsub = t(p.position) || t(siteText('footerTitle')), rights = t(siteText('rights'));
  const foot = $('#footer'); foot.hidden = !(fname || fsub || rights);
  $('#footer-l').innerHTML = (fname ? `<b>${esc(fname)}</b>` : '') + (fsub ? `<span>${esc(fsub)}</span>` : '');
  $('#footer-r').textContent = (name || rights) ? `© ${new Date().getFullYear()}${name ? ' ' + name : ''}${rights ? (name ? '. ' : ' ') + rights : ''}` : ''; $('#footer-r').hidden = !(name || rights);
}
function applyTypography() {
  const ty = appData.typography, ff = n => FONT_FALLBACKS[n || 'Inter'] || FONT_FALLBACKS.Inter;
  $$('[data-sec]').forEach(el => { if (el.tagName === 'SECTION') el.style.fontFamily = ff(ty[el.dataset.sec]); });
  $$('[data-sub]').forEach(el => el.style.fontFamily = ff(ty[el.dataset.sub]));
}

/* ---------------- interactions ---------------- */
function setMenu(open) {
  $('#mobile-menu').classList.toggle('open', open); $('#menu-backdrop').classList.toggle('open', open);
  $('#menu-btn').setAttribute('aria-expanded', String(open)); document.body.style.overflow = open ? 'hidden' : '';
}
function expandSection(sec) {
  if (!sec || !sec.classList.contains('collapsed')) return;
  sec.classList.remove('collapsed'); const tg = sec.querySelector('.sec-toggle'); if (tg) tg.setAttribute('aria-expanded', 'true');
}
if (window.matchMedia) matchMedia('(min-width:1024px)').addEventListener('change', e => { if (e.matches) setMenu(false); });
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) { }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); const lbBg = e.target.id === 'lb';
  if (lbBg) return closeLb();
  if (e.target.id === 'menu-backdrop') return setMenu(false);
  // clicking anywhere on a collapsed section expands it (the arrow button still toggles)
  const cs = e.target.closest('section.collapsed');
  if (cs && !e.target.closest('.sec-toggle,a,input,select,textarea')) { expandSection(cs); return; }
  // menu / nav links: close the drawer and expand the target section before the page scrolls to it
  const nl = e.target.closest('#mobile-menu a[href^="#"], #nav a[href^="#"]');
  if (nl) { expandSection(document.getElementById(nl.getAttribute('href').slice(1))); setMenu(false); return; }
  if (e.target.closest('#mobile-menu a')) { setMenu(false); return; }
  if (!b) return;
  const id = b.dataset.sec;
  switch (b.dataset.act) {
    case 'pubfilter': UI[id].filter = b.dataset.val; UI[id].all = false; refreshPubs(id); break;
    case 'secmore': { const sec = b.closest('section'), open = sec.classList.toggle('open'); b.textContent = open ? b.dataset.less : b.dataset.more; break; }
    case 'collapse': { const sec = b.closest('section'), col = sec.classList.toggle('collapsed'); b.setAttribute('aria-expanded', String(!col)); break; }
    case 'cert': openCert(b.dataset.url, b.dataset.title); break;
    case 'galmore': UI[id].all = !UI[id].all; refreshGallery(id); break;
    case 'pubmore': UI[id].all = !UI[id].all; refreshPubs(id); break;
    case 'album': UI[id].album = b.dataset.val; refreshGallery(id); break;
    case 'open': openLb(id, +b.dataset.i); break;
    case 'lbclose': closeLb(); break; case 'lbprev': stepLb(-1); break; case 'lbnext': stepLb(1); break;
    case 'theme': toggleTheme(); break;
    case 'menu': setMenu(!$('#mobile-menu').classList.contains('open')); break;
    case 'menuclose': setMenu(false); break;
  }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-act="pubsearch"]'); if (el) { UI[el.dataset.sec].q = el.value; refreshPubs(el.dataset.sec); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#mobile-menu').classList.contains('open')) { setMenu(false); return; }
  if (activeLb) { if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') stepLb(-1); else if (e.key === 'ArrowRight') stepLb(1); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-act="open"]')) { e.preventDefault(); openLb(e.target.dataset.sec, +e.target.dataset.i); }
});

/* ---------------- load ---------------- */
window.addEventListener('load', () => {
  fetch('data.json?t=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(json => { appData = normalize(json); renderAll(); })
    .catch(err => {
      console.error('Could not load site content:', err);
      $('#main').innerHTML = '<div class="loading" style="text-align:center;padding:2rem"><div>Could not load <b>data.json</b>.<br><span style="font-weight:400">If you opened this file directly from disk, run it through a local web server instead &mdash; browsers block fetch() on file:// pages.</span></div></div>';
    });
});

</script>
</body>
</html>
